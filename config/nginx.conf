# nginx route for claude-gateway.
#
# Paste these blocks inside the HTTPS server { } of proxyx.online
# (/etc/nginx/conf.d/proxyx.conf on the server `local`, which also runs the gateway), ABOVE `location / { ... }`.
# Everything that starts with /claude goes to the gateway; the rest stays on the site.
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# Public base URL: https://proxyx.online/claude/api
# The gateway answers under /claude/api because GATEWAY_BASE_PATH=/claude/api in .env.

# Admin panel: office network only.
location ^~ /claude/api/admin {
    allow 192.168.0.0/24;
    deny all;
    proxy_pass http://127.0.0.1:8443;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API: /claude/api/v1/messages, /claude/api/v1/models, /claude/api/health
location ^~ /claude {
    proxy_pass http://127.0.0.1:8443;       # no trailing slash: keeps the /claude/api prefix
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                        # streaming replies (SSE)
    proxy_cache off;
    proxy_read_timeout 900s;                    # long answers
    proxy_send_timeout 900s;
    client_max_body_size 64m;                   # images are sent inside the JSON
}
